[project]
name = "wirra-bore"
version = "0.1.0"
description = "Off-grid agri-energy dispatch prototype (dumb / greedy / MILP)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E741"]
